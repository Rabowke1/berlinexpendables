name: CI
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  tools-and-prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run assets
      - run: npm run typecheck
      - run: npm run build
      - name: Generierte Assets müssen eingecheckt sein
        run: git diff --exit-code -- Prototype/Web/public/assets Content/Import/Placeholder docs/art
      - name: Python-Skripte syntaxprüfen (Editor-Skripte & Pixelize)
        run: python3 -m py_compile Content/Python/*.py Tools/pixelize/pixelize.py
  # Der UE-5.8-Build läuft lokal/im Editor (Live Coding über MCP) – siehe docs/MCP_RUNBOOK.md.
